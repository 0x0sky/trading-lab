[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-x-da-trading-lab"
version = "0.0.1"
description = "Offline event replay and paper-trading research for 0xda-market"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "0xda-market" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.14,<1.0"]
market = ["websockets>=15,<17"]

[project.scripts]
trading-lab = "trading_lab.cli:main"
trading-lab-market = "trading_lab.collectors.binance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88
