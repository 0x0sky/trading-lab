name: Full CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          bundler-cache: true
      - name: Syntax
        run: find lib bin test -name '*.rb' -o -name 'trading-lab' | xargs -r -n1 ruby -c
      - name: Tests
        run: bundle exec ruby -Itest test/replay_test.rb
      - name: Offline replay smoke
        run: bundle exec ruby bin/trading-lab replay examples/demo.jsonl
